name: Android Release APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main' && github.repository == 'b-behrouz/puzzle'
    environment: android-release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out trusted main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-$RUNNER_TEMP/android-sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          manager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$manager" ]]; then
            tools="$RUNNER_TEMP/android-command-line-tools"
            curl --fail --silent --show-error --location --retry 3 \
              https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip \
              --output "$RUNNER_TEMP/android-command-line-tools.zip"
            unzip -q "$RUNNER_TEMP/android-command-line-tools.zip" -d "$tools"
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            manager="$ANDROID_HOME/cmdline-tools/19.0/bin/sdkmanager"
            if [[ ! -x "$manager" ]]; then
              mv "$tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/19.0"
            fi
          fi
          (yes || true) | "$manager" --licenses >/dev/null
          "$manager" "platforms;android-36" "build-tools;35.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
      - name: Install dependencies and sync bundled web assets
        run: |
          python3 -m unittest discover -s scripts -p test_release_signing.py
          npm ci
          npm run android:sync
      - name: Sign, assemble and verify release
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          umask 077
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/tikechin-release-signing/tikechin-release.jks"
          mkdir -p "$(dirname "$ANDROID_KEYSTORE_PATH")"
          trap 'rm -rf -- "$RUNNER_TEMP/tikechin-release-signing"' EXIT
          python3 scripts/prepare-release-signing.py
          keytool -exportcert -keystore "$ANDROID_KEYSTORE_PATH" \
            -alias "$ANDROID_KEY_ALIAS" -storepass:env ANDROID_KEYSTORE_PASSWORD \
            -file "$RUNNER_TEMP/tikechin-release-signing/certificate.der" >/dev/null
          # Keep the signing credentials scoped to this step and disable the daemon.
          (cd android && ./gradlew --no-daemon assembleRelease)
          python3 scripts/verify-release-apk.py \
            android/app/build/outputs/apk/release/app-release.apk \
            "$RUNNER_TEMP/tikechin-release-signing/certificate.der" \
            "$RUNNER_TEMP/tikechin-release-public"
          cat "$RUNNER_TEMP/tikechin-release-public/release-verification.txt" >> "$GITHUB_STEP_SUMMARY"
      - name: Clean up signing material
        if: always()
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/tikechin-release-signing"
      - name: Upload verified Release APK and public report
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: tikechin-release-apk
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            ${{ runner.temp }}/tikechin-release-public/release-verification.txt
            ${{ runner.temp }}/tikechin-release-public/app-release.apk.sha256
          if-no-files-found: error
          retention-days: 14
