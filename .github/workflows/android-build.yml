name: Android Debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK packages
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-$RUNNER_TEMP/android-sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          manager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$manager" ]]; then
            tools="$RUNNER_TEMP/android-command-line-tools"
            curl --fail --silent --show-error --location --retry 3 \
              https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip \
              --output "$RUNNER_TEMP/android-command-line-tools.zip"
            unzip -q "$RUNNER_TEMP/android-command-line-tools.zip" -d "$tools"
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            manager="$ANDROID_HOME/cmdline-tools/19.0/bin/sdkmanager"
            if [[ ! -x "$manager" ]]; then
              mv "$tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/19.0"
            fi
          fi
          # sdkmanager closes stdin after accepting the last license.
          (yes || true) | "$manager" --licenses >/dev/null
          "$manager" "platforms;android-36" "build-tools;35.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
      - name: Install npm dependencies
        run: npm ci
      - name: Build web assets, sync Capacitor, and assemble Debug APK
        run: npm run android:debug
      - name: Upload Debug APK
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: puzzle-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
